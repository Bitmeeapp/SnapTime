<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snap Time - Real Moments Sharing</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-zinc-950 text-gray-100 font-sans min-h-screen flex flex-col items-center justify-between p-4">

  <!-- Header -->
  <header class="w-full max-w-md flex justify-between items-center py-3 border-b border-zinc-800">
    <h1 class="text-2xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-purple-500 to-green-400">
      SNAP TIME
    </h1>
    <div class="flex items-center gap-2 bg-zinc-900 px-3 py-1 rounded-full text-xs font-semibold text-green-400 border border-zinc-800">
      <i class="fa-solid fa-fire text-amber-500"></i> <span id="streakCount">12</span> Day Streak
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="w-full max-w-md flex-1 flex flex-col items-center my-3 overflow-hidden">

    <!-- CAMERA SCREEN -->
    <div id="screenCamera" class="w-full flex-1 flex flex-col items-center justify-center">
      
      <!-- Daily Alert Banner -->
      <div class="w-full mb-3 p-3 rounded-2xl bg-gradient-to-r from-purple-900/40 to-zinc-900 border border-purple-500/30 flex items-center justify-between">
        <div>
          <p class="text-[10px] text-purple-400 font-bold uppercase tracking-widest">⚡ Time To Be Real</p>
          <p class="text-xs text-gray-200 font-medium">Capture your raw moment!</p>
        </div>
        <div class="text-right">
          <span id="countdownTimer" class="text-lg font-mono font-bold text-green-400">01:59</span>
        </div>
      </div>

      <!-- Camera Viewport -->
      <div class="relative w-full aspect-[3/4] bg-zinc-900 rounded-3xl overflow-hidden border border-zinc-800 shadow-2xl flex items-center justify-center">
        <video id="webcam" autoplay playsinline class="w-full h-full object-cover hidden"></video>
        <div id="cameraPlaceholder" class="w-full h-full bg-zinc-900 flex flex-col items-center justify-center text-zinc-500 gap-2">
          <i class="fa-solid fa-camera text-4xl text-purple-500"></i>
          <span class="text-xs">Tap Camera Icon to Start</span>
        </div>

        <div class="absolute bottom-4 left-4 bg-black/70 backdrop-blur-md px-3 py-1.5 rounded-full text-xs text-zinc-200 font-medium flex items-center gap-2 border border-zinc-800">
          <i class="fa-solid fa-bolt text-purple-400"></i>
          <span id="selectedVibeTag">Late Night Grind ☕</span>
        </div>
      </div>

      <!-- Vibe Mood Selector -->
      <div class="w-full flex gap-2 overflow-x-auto my-3 py-1">
        <button onclick="setVibe('Late Night Grind ☕')" class="bg-zinc-900 hover:bg-purple-900/50 text-xs text-zinc-300 px-3 py-1.5 rounded-full whitespace-nowrap border border-zinc-800">Late Night Grind ☕</button>
        <button onclick="setVibe('Chai Break 🍵')" class="bg-zinc-900 hover:bg-purple-900/50 text-xs text-zinc-300 px-3 py-1.5 rounded-full whitespace-nowrap border border-zinc-800">Chai Break 🍵</button>
        <button onclick="setVibe('Code & Chill 💻')" class="bg-zinc-900 hover:bg-purple-900/50 text-xs text-zinc-300 px-3 py-1.5 rounded-full whitespace-nowrap border border-zinc-800">Code & Chill 💻</button>
      </div>

      <!-- Controls -->
      <div class="w-full flex items-center justify-around my-2">
        <button id="btnMic" onclick="toggleVoiceRecord()" class="w-12 h-12 rounded-full bg-zinc-900 border border-zinc-800 text-zinc-300 flex items-center justify-center">
          <i class="fa-solid fa-microphone text-lg"></i>
        </button>

        <button onclick="captureSnap()" class="w-20 h-20 rounded-full border-4 border-purple-500 bg-white/10 flex items-center justify-center active:scale-95 transition shadow-lg shadow-purple-500/30">
          <div class="w-14 h-14 rounded-full bg-purple-500"></div>
        </button>

        <button onclick="startCamera()" class="w-12 h-12 rounded-full bg-zinc-900 border border-zinc-800 text-zinc-300 flex items-center justify-center">
          <i class="fa-solid fa-camera-rotate text-lg"></i>
        </button>
      </div>
    </div>

    <!-- FEED SCREEN -->
    <div id="screenFeed" class="w-full flex-1 flex-col gap-4 overflow-y-auto hidden">
      <h2 class="text-sm font-bold text-zinc-400 uppercase tracking-widest px-1">Today's Raw Feed</h2>
      <div id="feedList" class="flex flex-col gap-4 w-full"></div>
    </div>

    <!-- CIRCLES SCREEN -->
    <div id="screenCircles" class="w-full flex-1 flex-col items-center justify-center hidden text-zinc-400">
      <i class="fa-solid fa-user-group text-4xl mb-2 text-purple-400"></i>
      <p class="text-sm font-medium">Inner Circle</p>
    </div>

    <!-- MEMORIES SCREEN -->
    <div id="screenMemories" class="w-full flex-1 flex-col items-center justify-center hidden text-zinc-400">
      <i class="fa-solid fa-calendar-days text-4xl mb-2 text-purple-400"></i>
      <p class="text-sm font-medium">Time Capsule</p>
    </div>

    <!-- PROFILE SCREEN -->
    <div id="screenProfile" class="w-full flex-1 flex-col items-center justify-center hidden text-zinc-400">
      <div class="w-20 h-20 rounded-full bg-purple-600 flex items-center justify-center text-2xl font-bold text-white mb-2">ST</div>
      <p class="text-lg font-bold text-white">@sanptime_user</p>
    </div>

  </main>

  <!-- Bottom Navigation -->
  <nav class="w-full max-w-md bg-zinc-900 border border-zinc-800 rounded-2xl p-3 flex justify-around">
    <button onclick="switchTab('camera')" id="navCamera" class="flex flex-col items-center text-purple-400 text-xs gap-1">
      <i class="fa-solid fa-camera text-lg"></i><span>Snap</span>
    </button>
    <button onclick="switchTab('feed')" id="navFeed" class="flex flex-col items-center text-zinc-500 text-xs gap-1">
      <i class="fa-solid fa-house text-lg"></i><span>Feed</span>
    </button>
    <button onclick="switchTab('circles')" id="navCircles" class="flex flex-col items-center text-zinc-500 text-xs gap-1">
      <i class="fa-solid fa-user-group text-lg"></i><span>Circles</span>
    </button>
    <button onclick="switchTab('memories')" id="navMemories" class="flex flex-col items-center text-zinc-500 text-xs gap-1">
      <i class="fa-solid fa-calendar-days text-lg"></i><span>Memories</span>
    </button>
    <button onclick="switchTab('profile')" id="navProfile" class="flex flex-col items-center text-zinc-500 text-xs gap-1">
      <i class="fa-solid fa-user text-lg"></i><span>Profile</span>
    </button>
  </nav>

  <!-- JavaScript Logic -->
  <script>
    let currentVibe = 'Late Night Grind ☕';
    let postsData = [
      { id: 1, username: 'alex_genz', vibe: 'Chai Break 🍵', time: '10m ago', fire: 5, heart: 3 }
    ];

    // Timer
    let timeLeft = 119;
    setInterval(() => {
      if(timeLeft > 0) {
        timeLeft--;
        let m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
        let s = String(timeLeft % 60).padStart(2, '0');
        const tElem = document.getElementById('countdownTimer');
        if(tElem) tElem.innerText = `${m}:${s}`;
      }
    }, 1000);

    // Camera
    async function startCamera() {
      try {
        const video = document.getElementById('webcam');
        const placeholder = document.getElementById('cameraPlaceholder');
        const mediaStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        video.srcObject = mediaStream;
        video.classList.remove('hidden');
        placeholder.classList.add('hidden');
      } catch (e) {
        alert("Camera access was blocked or is unavailable.");
      }
    }

    function setVibe(tag) {
      currentVibe = tag;
      document.getElementById('selectedVibeTag').innerText = tag;
    }

    function toggleVoiceRecord() {
      alert("🎙️ Voice Vibe toggled!");
    }

    function captureSnap() {
      postsData.unshift({
        id: Date.now(),
        username: 'you_sanptime',
        vibe: currentVibe,
        time: 'Just now',
        fire: 0,
        heart: 0
      });
      renderFeed();
      switchTab('feed');
    }

    function renderFeed() {
      const list = document.getElementById('feedList');
      if(!list) return;
      list.innerHTML = postsData.map(p => `
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-3 flex flex-col gap-2">
          <div class="flex justify-between text-xs font-bold text-purple-400">
            <span>@${p.username}</span>
            <span class="text-zinc-500 font-normal">${p.time}</span>
          </div>
          <div class="w-full aspect-[3/4] bg-zinc-950 rounded-xl flex items-center justify-center text-zinc-600 border border-zinc-800">
            <i class="fa-solid fa-camera text-3xl"></i>
          </div>
          <div class="text-xs text-zinc-300">⚡ ${p.vibe}</div>
        </div>
      `).join('');
    }

    function switchTab(tab) {
      ['camera', 'feed', 'circles', 'memories', 'profile'].forEach(s => {
        const sElem = document.getElementById('screen' + s.charAt(0).toUpperCase() + s.slice(1));
        const nElem = document.getElementById('nav' + s.charAt(0).toUpperCase() + s.slice(1));
        if(s === tab) {
          if(sElem) { sElem.classList.remove('hidden'); sElem.classList.add('flex'); }
          if(nElem) { nElem.classList.remove('text-zinc-500'); nElem.classList.add('text-purple-400'); }
        } else {
          if(sElem) { sElem.classList.add('hidden'); sElem.classList.remove('flex'); }
          if(nElem) { nElem.classList.add('text-zinc-500'); nElem.classList.remove('text-purple-400'); }
        }
      });
    }

    renderFeed();
  </script>
</body>
</html>
